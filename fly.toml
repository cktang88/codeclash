# fly.toml app configuration file generated for codeclash on 2026-10-30T15:08:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'codeclash'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = '30s'
swap_size_mb = 512

[build]

[env]
  DATABASE_PATH = '/data/codeclash.db'
  MIRROR_DIR = '/data/mirrors'
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=320'
  PARSE_WORKERS = '1'
  PORT = '8080'
  PUBLIC_URL = 'https://codeclash.fly.dev'

[[mounts]]
  source = 'codeclash_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '512mb'
