<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Clash sound lab</title>
    <style>
      body { margin: 0; padding: 24px; background: #12161f; color: #efe4c8; font: 15px/1.45 Alegreya, Georgia, serif; }
      h1 { font: 600 22px 'IM Fell English SC', Georgia, serif; color: #d4a93e; margin: 0 0 4px; }
      h2 { font: 600 15px 'IM Fell English SC', Georgia, serif; color: #b8321f; margin: 20px 0 8px; letter-spacing: 0.04em; }
      p { color: #b9a477; margin: 0 0 16px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      button { background: #22180f; color: #efe4c8; border: 1px solid #8a6418; padding: 6px 10px; font: inherit; cursor: pointer; }
      button:hover { border-color: #f6dc8c; }
      button:focus-visible { outline: 2px solid #f6dc8c; outline-offset: 2px; }
      label { display: grid; grid-template-columns: 140px 280px 60px; align-items: center; gap: 8px; margin: 6px 0; }
      #status { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #b9a477; }
    </style>
  </head>
  <body>
    <h1>Sound lab</h1>
    <p>Every cue, the music layers, and the controls the battlefield drives.</p>
    <div class="row"><button id="power">Turn sound on</button><button id="music">Music: on</button></div>
    <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" /> <span id="volume-v"></span></label>
    <label>Battle intensity <input id="intensity" type="range" min="0" max="1" step="0.01" value="0" /> <span id="intensity-v">0</span></label>
    <label>Time of day <input id="time" type="range" min="0" max="1" step="0.01" value="0.1" /> <span id="time-v">0.1</span></label>
    <label>Pan (camera x) <input id="pan" type="range" min="-1200" max="1200" step="10" value="0" /> <span id="pan-v">0</span></label>
    <div id="status"></div>
    <div id="cues"></div>
    <script type="module" src="./lab.ts"></script>
  </body>
</html>
