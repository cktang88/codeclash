<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Render Lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e11; color: #e9e4d6; font: 13px/1.4 Inter, system-ui, sans-serif; overflow: hidden; }
      #field { position: fixed; inset: 0; }
      #panel[hidden] { display: none; }
      #panel { position: fixed; top: 10px; left: 10px; background: rgba(10, 12, 15, 0.82); border: 1px solid #333; border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; }
      #panel button { background: #1d232a; color: #e9e4d6; border: 1px solid #3a4450; border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; }
      #stats { font-family: 'JetBrains Mono', monospace; min-width: 260px; }
    </style>
  </head>
  <body>
    <div id="field"></div>
    <div id="panel" hidden>
      <span id="stats">…</span>
      <button id="zin">+</button>
      <button id="zout">−</button>
      <button id="follow">follow</button>
    </div>
    <script type="module" src="./render-lab.ts"></script>
  </body>
</html>
