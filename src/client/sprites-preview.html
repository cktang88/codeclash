<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprite Preview</title>
    <style>
      body { margin: 0; background: #1b1712; color: #d9d2bf; font: 13px/1.3 monospace; }
      header { padding: 8px 12px; }
      a { color: #e0b860; }
      h2 { margin: 14px 12px 4px; font-size: 14px; }
      table { border-collapse: collapse; margin: 0 12px; }
      td, th { padding: 1px 3px; vertical-align: middle; font-weight: normal; }
      canvas { image-rendering: pixelated; display: block; }
    </style>
  </head>
  <body>
    <header id="info"></header>
    <main id="out"></main>
    <script type="module">
      // ?mode=bones is the skeleton demo (bones-preview.ts); every other mode is the sprite preview.
      if (new URLSearchParams(location.search).get('mode') === 'bones') import('./bones-preview.ts');
      else import('./sprites-preview.ts');
    </script>
  </body>
</html>
